name: Radar - empresas novas de SP (base aberta do CNPJ)
on:
  schedule:
    - cron: '0 10 * * 1'   # toda segunda, 7h de Brasília; a Arizona ignora empresa repetida
  workflow_dispatch:
permissions:
  contents: read
  id-token: write          # token OIDC do GitHub, conferido pela Arizona (sem senha guardada)
jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Baixa a base mais recente da Receita
        run: |
          T=YggdBLfdninEJX9; B=https://arquivos.receitafederal.gov.br/public.php/webdav
          M=""
          for i in 1 2 3 4 5 6; do
            M=$(curl -sS -m 120 -u "$T:" -X PROPFIND -H 'Depth: 1' "$B/" | grep -oE '[0-9]{4}-[0-9]{2}' | sort -u | tail -1 || true)
            [ -n "$M" ] && break; echo "lista da Receita sem resposta (tentativa $i), esperando"; sleep 60
          done
          if [ -z "$M" ]; then
            # sem a lista: tenta o mês atual e o anterior direto pelo arquivo
            for c in $(date +%Y-%m) $(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m); do
              if curl -sS -m 120 -u "$T:" -o /dev/null -w '%{http_code}' -I "$B/$c/Cnaes.zip" | grep -q 200; then M=$c; break; fi
            done
          fi
          if [ -z "$M" ]; then echo "::error::Servidor de dados abertos da Receita fora do ar; o radar tenta de novo na próxima segunda"; exit 1; fi
          ALVO=$(date -d "$M-01 -1 month" +%Y%m); echo "base $M, empresas abertas em $ALVO"; echo "ALVO=$ALVO" >> $GITHUB_ENV
          mkdir -p /tmp/rf && cd /tmp/rf
          # o servidor da Receita derruba a conexão no meio dos arquivos grandes: retoma de onde parou (-C -) até 12 vezes
          for f in Cnaes Municipios Simples Empresas{0..9} Estabelecimentos{0..9}; do
            ok=""
            for t in $(seq 1 12); do
              if curl -sS -m 1800 -C - --retry 5 --retry-delay 15 --retry-all-errors -u "$T:" -o $f.zip "$B/$M/$f.zip" && unzip -tq $f.zip >/dev/null 2>&1; then ok=1; break; fi
              echo "$f.zip interrompido (tentativa $t), retomando"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$f.zip não baixou inteiro; o radar tenta de novo na próxima segunda"; exit 1; }
          done
          ls -la | tail -3
      - name: Separa e manda à Arizona (o log mostra só contagens)
        run: |
          python3 ferramentas/radar/radar.py leads /tmp/rf $ALVO
